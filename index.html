                <div class="role-card" id="role-student" onclick="selectRole('student')"><div class="role-icon">🎒</div><div class="role-title">Student</div></div>
                <div class="role-card" id="role-teacher" onclick="selectRole('teacher')"><div class="role-icon">👨‍🏫</div><div class="role-title">Teacher</div></div>

            </div>

     THE APP ENGINE (JAVASCRIPT)

<script>
    let selectedRole = '';

    window.onload = function() {
        checkOwnerLimit();
    };

    function checkOwnerLimit() {
        let ownerCount = parseInt(localStorage.getItem('jalaram_owner_count')) || 0;
        if (ownerCount >= 3) {
            document.getElementById('role-owner').style.display = 'none';
            document.getElementById('roleGrid').style.gridTemplateColumns = '1fr 1fr 1fr';
        }
    }

    function selectRole(role) {
        selectedRole = role;
        let cards = document.querySelectorAll('.role-card');
        cards.forEach(card => card.classList.remove('selected'));
        document.getElementById('role-' + role).classList.add('selected');
    }

    function processRegistration() {
        let name = document.getElementById('reg_name').value;
        let phone = document.getElementById('reg_phone').value;

        if(selectedRole === '') { alert("Please select a role (Student, Teacher, Admin, or Owner)!"); return; }
        if(name === '' || phone === '') { alert("Please enter your name and phone number!"); return; }

        if (selectedRole === 'owner') {
            let ownerCount = parseInt(localStorage.getItem('jalaram_owner_count')) || 0;
            localStorage.setItem('jalaram_owner_count', ownerCount + 1);
        }

        let randomString = Math.random().toString(36).substring(2, 15);
        let generatedToken = "AUTH_" + selectedRole.toUpperCase() + "_" + randomString;

        alert("Registration Successful!\nRole: " + selectedRole.toUpperCase() + "\nToken: " + generatedToken + "\n\n(Waiting for Module 2/3 connections.)");
        
        document.getElementById('reg_name').value = '';
        document.getElementById('reg_phone').value = '';
        let cards = document.querySelectorAll('.role-card');
        cards.forEach(card => card.classList.remove('selected'));
        selectedRole = '';
        checkOwnerLimit();
    }

    function tryEditCourses() {
        alert("SECURITY CHECK: You must be logged in as an OWNER or authorized ADMIN to edit the demo courses.");
    }

    function requestAdminApproval() {
        alert("Your login request has been sent to the Admin Portal. Please wait for approval.");
    }

<script>
    // --- TAB SYSTEM LOGIC ---
    function switchTab(clickedBtn, tabId) {
        // Hide all tabs & remove active class from buttons
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        // Show selected tab & highlight button
        document.getElementById(tabId).classList.add('active');
        clickedBtn.classList.add('active');
    }

    // --- ACCORDION LOGIC ---
    function toggleAccordion(bodyId, headerElement) {
        let body = document.getElementById(bodyId);
        let arrow = headerElement.querySelector('.acc-arrow');
        
        if (body.classList.contains('collapsed')) {
            body.classList.remove('collapsed');
            arrow.innerText = '▼';
        } else {
            body.classList.add('collapsed');
            arrow.innerText = '▶';
        }
    }

    // --- BUTTON ACTIONS ---
    function simulateVideoPlay() {
        alert("🎥 [VIDEO PLAYER INITIATED]\n\nOpens the Admin-Uploaded MP4/YouTube link in full screen.");
    }

    function triggerCheckout() {
        alert("🔒 SECURE PAYMENT GATEWAY\n\nProcessing purchase for: Physics Mastery\nAmount: ₹4,999\n\n(Connects to Razorpay/UPI)");
    }

<script>
    let activeHomeworkId = '';
    let fileSelected = false;

    // --- TAB LOGIC ---
    function switchTab(clickedBtn, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        clickedBtn.classList.add('active');
    }

    // --- UPLOAD SHEET LOGIC ---
    function openUploadSheet(hwTitle, hwId) {
        activeHomeworkId = hwId;
        document.getElementById('upload_title').innerText = "Submit: " + hwTitle;
        
        // Reset state
        fileSelected = false;
        document.getElementById('file_name_display').innerText = "Tap to select PDF";
        document.getElementById('file_name_display').style.color = "#004aad";
        
        let overlay = document.getElementById('upload_overlay');
        let sheet = document.getElementById('upload_sheet');
        overlay.style.display = 'block';
        setTimeout(() => { overlay.style.opacity = '1'; sheet.style.bottom = '0'; }, 10);
    }

    function closeUploadSheet() {
        let overlay = document.getElementById('upload_overlay');
        let sheet = document.getElementById('upload_sheet');
        sheet.style.bottom = '-100%';
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }

    function simulateFileSelect() {
        // Simulates the native Android/iOS file picker
        fileSelected = true;
        document.getElementById('file_name_display').innerText = "Neil_Maths_Answer.pdf";
        document.getElementById('file_name_display').style.color = "#2e7d32"; // Green success color
    }

    function submitHomework() {
        if (!fileSelected) {
            alert("Error: Please select a file first.");
            return;
        }

        // Change button text to show loading
        let btn = document.getElementById('submit_btn');
        btn.innerText = "Uploading...";
        btn.style.opacity = "0.7";

        // Simulate network delay
        setTimeout(() => {
            alert("✅ Assignment Submitted Successfully!");
            closeUploadSheet();
            btn.innerText = "Submit Assignment";
            btn.style.opacity = "1";

            // Update the UI dynamically to show it's done
            if (activeHomeworkId) {
                let badge = document.getElementById('badge_' + activeHomeworkId.split('_')[1]);
                if (badge) {
                    badge.className = "badge completed";
                    badge.innerText = "✅ Submitted";
                }
            }
        }, 1500);
    }

<script>
    let currentStudentChecking = '';

    // --- NAVIGATION LOGIC ---
    function openGrading(studentName, hwTitle) {
        currentStudentChecking = studentName.toLowerCase();
        document.getElementById('grade_student_name').innerText = studentName;
        document.getElementById('grade_hw_title').innerText = hwTitle + ".pdf";
        
        document.getElementById('screen_inbox').classList.remove('active-module');
        document.getElementById('screen_grading').classList.add('active-module');
        document.querySelector('.app-container').scrollTop = 0;
    }

    function closeGrading() {
        document.getElementById('screen_grading').classList.remove('active-module');
        document.getElementById('screen_inbox').classList.add('active-module');
    }

    // --- GRADING ACTIONS ---
    function approveHomework() {
        alert("✅ Approved!\n\nSystem: Grade recorded. The student will see '✅ Graded' on their app.");
        removeCardAndGoBack();
    }

    // --- REJECTION / PENDING LOGIC (Your requested feature) ---
    function openRejectSheet() {
        let overlay = document.getElementById('reject_overlay');
        let sheet = document.getElementById('reject_sheet');
        overlay.style.display = 'block';
        setTimeout(() => { overlay.style.opacity = '1'; sheet.style.bottom = '0'; }, 10);
    }

    function closeRejectSheet() {
        let overlay = document.getElementById('reject_overlay');
        let sheet = document.getElementById('reject_sheet');
        sheet.style.bottom = '-100%';
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }

    function selectReason(element) {
        // Toggle selected state on pills
        if (element.classList.contains('selected')) {
            element.classList.remove('selected');
            document.getElementById('reject_comment').value = "";
        } else {
            // Remove from others
            document.querySelectorAll('.reason-pill').forEach(p => p.classList.remove('selected'));
            element.classList.add('selected');
            // Auto-fill textbox
            document.getElementById('reject_comment').value = element.innerText;
        }
    }

    function confirmRejection() {
        let reason = document.getElementById('reject_comment').value;
        if(reason.trim() === '') {
            alert("Please provide a reason so the student knows what to fix.");
            return;
        }

        // Logic confirmation
        alert("❌ Homework Returned.\n\nSystem: Pushed back to " + document.getElementById('grade_student_name').innerText + " as '⏳ Pending'.\nReason given: " + reason);
        
        closeRejectSheet();
        removeCardAndGoBack();
    }

    // --- UI CLEANUP ---
    function removeCardAndGoBack() {
        // Remove the card from the inbox so the teacher knows they are done with it
        let cardId = 'card_' + currentStudentChecking;
        let card = document.getElementById(cardId);
        if (card) {
            card.style.display = 'none';
        }
        
        // Go back to inbox
        closeGrading();
    }

     APP LOGIC (JAVASCRIPT)
     ========================================= -->
<script>
    // --- DATABASE: THE EXAM QUESTIONS ---
    const quizData = [
        {
            id: 1,
            question: "Physics: A car accelerates from rest at a constant rate of 2 m/s². What is its velocity after 5 seconds?",
            options: ["5 m/s", "10 m/s", "15 m/s", "20 m/s"],
            correctIndex: 1 // "10 m/s"
        },
        {
            id: 2,
            question: "Maths: What is the derivative of sin(x) with respect to x?",
            options: ["cos(x)", "-cos(x)", "sin(x)", "-sin(x)"],
            correctIndex: 0 // "cos(x)"
        },
        {
            id: 3,
            question: "Chemistry: Which of the following is the chemical formula for Baking Soda?",
            options: ["Na2CO3", "NaCl", "NaHCO3", "NaOH"],
            correctIndex: 2 // "NaHCO3"
        }
    ];

    // --- EXAM STATE VARIABLES ---
    let currentIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null); // Stores the index of selected options
    let timerInterval;
    let totalSeconds = 3 * 60; // 3 Minutes for demo

    // --- CORE EXAM FUNCTIONS ---
    function startTest() {
        // Switch UI
        document.getElementById('screen_intro').classList.remove('active-module');
        document.getElementById('screen_test').classList.add('active-module');
        
        // Load first question
        loadQuestion(0);
        
        // Start Timer
        startTimer();
    }

    function loadQuestion(index) {
        let q = quizData[index];
        
        // Update Headers
        document.getElementById('display_q_num').innerText = `Question ${index + 1} of ${quizData.length}`;
        document.getElementById('display_question').innerText = q.question;

        // Render Options
        let optionsHtml = '';
        const letters = ['A', 'B', 'C', 'D'];
        
        for(let i = 0; i < q.options.length; i++) {
            let isSelected = (userAnswers[index] === i) ? 'selected' : '';
            optionsHtml += `
                <div class="option-card ${isSelected}" onclick="selectOption(${i})">
                    <div class="option-letter">${letters[i]}</div>
                    <div class="option-text">${q.options[i]}</div>
                </div>
            `;
        }
        document.getElementById('options_container').innerHTML = optionsHtml;

        // Button States (Hide/Show Prev/Next)
        document.getElementById('btn_prev').disabled = (index === 0);
        
        if (index === quizData.length - 1) {
            document.getElementById('btn_next').style.display = 'none';
            document.getElementById('btn_submit_test').style.display = 'block';
        } else {
            document.getElementById('btn_next').style.display = 'block';
            document.getElementById('btn_submit_test').style.display = 'none';
        }
    }

    function selectOption(optionIndex) {
        // Save answer
        userAnswers[currentIndex] = optionIndex;
        // Re-render to show selection visually
        loadQuestion(currentIndex);
    }

    function changeQuestion(direction) {
        let newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < quizData.length) {
            currentIndex = newIndex;
            loadQuestion(currentIndex);
        }
    }

    // --- TIMER LOGIC ---
    function startTimer() {
        let display = document.getElementById('display_timer');
        
        timerInterval = setInterval(function () {
            let minutes = parseInt(totalSeconds / 60, 10);
            let seconds = parseInt(totalSeconds % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = "⏱ " + minutes + ":" + seconds;

            // Warning Color at 60 seconds
            if(totalSeconds <= 60) {
                display.className = "timer-box"; // removes 'safe' class, turning it red
            }

            if (--totalSeconds < 0) {
                clearInterval(timerInterval);
                alert("Time is up! Auto-submitting your test.");
                submitTest();
            }
        }, 1000);
    }

    // --- RESULT & CALCULATION LOGIC ---
    function submitTest() {
        clearInterval(timerInterval); // Stop timer

        let marks = 0;
        let attempted = 0;
        let correct = 0;
        let wrong = 0;

        // Calculate Score (+4 for correct, -1 for wrong)
        for (let i = 0; i < quizData.length; i++) {
            if (userAnswers[i] !== null) {
                attempted++;
                if (userAnswers[i] === quizData[i].correctIndex) {
                    correct++;
                    marks += 4;
                } else {
                    wrong++;
                    marks -= 1;
                }
            }
        }

        // Prevent negative total score visual if desired, but for JEE it can be negative.
        
        // Update UI
        document.getElementById('result_score').innerText = marks;
        document.getElementById('result_attempted').innerText = attempted;
        document.getElementById('result_correct').innerText = correct;
        document.getElementById('result_wrong').innerText = wrong;

        // Switch Screen
        document.getElementById('screen_test').classList.remove('active-module');
        document.getElementById('screen_result').classList.add('active-module');
    }

<script>
    // --- DATABASE: MOCK USERS ---
    // In a real app, this data comes from Firebase
    let pendingUsers = [
        { id: 'u1', name: 'Rahul Sharma', phone: '+91 98765 43210', role: 'student' },
        { id: 'u2', name: 'Priya Gupta', phone: '+91 87654 32109', role: 'teacher' },
        { id: 'u3', name: 'Rohan Singh', phone: '+91 76543 21098', role: 'student' }
    ];

    let approvedUsers = [
        { id: 'u0', name: 'Neil', phone: '+91 99999 00000', role: 'admin' }
    ];

    // --- INITIALIZATION ---
    window.onload = function() {
        renderUI();
    };

    // --- TAB LOGIC ---
    function switchTab(clickedBtn, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        clickedBtn.classList.add('active');
    }

    // --- RENDER ENGINE ---
    function renderUI() {
        // Update Counters
        document.getElementById('count_pending').innerText = pendingUsers.length;
        document.getElementById('count_approved').innerText = approvedUsers.length;

        // Render Pending List
        let pendingHtml = '';
        if (pendingUsers.length === 0) {
            pendingHtml = `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">No pending requests.</div></div>`;
        } else {
            pendingUsers.forEach(user => {
                pendingHtml += generateCardHTML(user, 'pending');
            });
        }
        document.getElementById('pending_container').innerHTML = pendingHtml;

        // Render Approved List
        let approvedHtml = '';
        if (approvedUsers.length === 0) {
            approvedHtml = `<div class="empty-state"><div class="empty-icon">👻</div><div class="empty-text">No users approved yet.</div></div>`;
        } else {
            approvedUsers.forEach(user => {
                approvedHtml += generateCardHTML(user, 'approved');
            });
        }
        document.getElementById('approved_container').innerHTML = approvedHtml;
    }

    // Helper: Generates the HTML for a single user card
    function generateCardHTML(user, type) {
        let roleClass = 'role-' + user.role;
        let avatarInitial = user.name.charAt(0).toUpperCase();
        let roleDisplay = user.role.toUpperCase();

        let buttonsHtml = '';
        if (type === 'pending') {
            buttonsHtml = `
                <div class="action-row">
                    <button class="btn-action btn-reject" onclick="rejectUser('${user.id}')">❌ Reject</button>
                    <button class="btn-action btn-approve" onclick="approveUser('${user.id}')">✅ Approve</button>
                </div>
            `;
        } else if (type === 'approved' && user.id !== 'u0') { // Protect 'Neil' from being revoked in demo
            buttonsHtml = `
                <div class="action-row">
                    <button class="btn-action btn-revoke" onclick="revokeUser('${user.id}')">🔒 Revoke Access</button>
                </div>
            `;
        }

        return `
            <div class="user-card ${roleClass}">
                <div class="user-header">
                    <div class="user-info">
                        <div class="avatar">${avatarInitial}</div>
                        <div>
                            <h3 class="user-name">${user.name}</h3>
                            <p class="user-phone">${user.phone}</p>
                        </div>
                    </div>
                    <div class="role-badge">${roleDisplay}</div>
                </div>
                ${buttonsHtml}
            </div>
        `;
    }

    // --- BUSINESS LOGIC ---
    function approveUser(id) {
        // Find user in pending array
        let userIndex = pendingUsers.findIndex(u => u.id === id);
        if (userIndex > -1) {
            let user = pendingUsers[userIndex];
            // Remove from pending
            pendingUsers.splice(userIndex, 1);
            // Add to approved
            approvedUsers.push(user);
            // Re-render UI
            renderUI();
            alert(`System: ${user.name} has been APPROVED. They can now log in.`);
        }
    }

    function rejectUser(id) {
        let userIndex = pendingUsers.findIndex(u => u.id === id);
        if (userIndex > -1) {
            let userName = pendingUsers[userIndex].name;
            pendingUsers.splice(userIndex, 1);
            renderUI();
            alert(`System: Request from ${userName} was REJECTED and deleted.`);
        }
    }

    function revokeUser(id) {
        let userIndex = approvedUsers.findIndex(u => u.id === id);
        if (userIndex > -1) {
            let userName = approvedUsers[userIndex].name;
            // Remove from approved, push back to pending
            let user = approvedUsers.splice(userIndex, 1)[0];
            pendingUsers.push(user);
            renderUI();
            alert(`System: Access for ${userName} has been REVOKED. They have been moved back to Pending.`);
        }
    }

<script>
    // --- FILTER LOGIC ---
    function filterNotices(category, clickedElement) {
        // Update active pill
        document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
        clickedElement.classList.add('active');

        // Filter cards
        let cards = document.querySelectorAll('.notice-card');
        cards.forEach(card => {
            if (category === 'all') {
                card.style.display = 'block';
            } else {
                if (card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            }
        });
    }

    // --- BOTTOM SHEET LOGIC ---
    function openCreateNotice() {
        let overlay = document.getElementById('notice_overlay');
        let sheet = document.getElementById('notice_sheet');
        overlay.style.display = 'block';
        setTimeout(() => { overlay.style.opacity = '1'; sheet.style.bottom = '0'; }, 10);
    }

    function closeCreateNotice() {
        let overlay = document.getElementById('notice_overlay');
        let sheet = document.getElementById('notice_sheet');
        sheet.style.bottom = '-100%';
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }

    // --- PUBLISH LOGIC ---
    function publishNotice() {
        let title = document.getElementById('new_title').value;
        let category = document.getElementById('new_category').value;
        let message = document.getElementById('new_message').value;

        if (title.trim() === '' || message.trim() === '') {
            alert("Please fill out both the title and message.");
            return;
        }

        // Determine badge styles based on selected category
        let badgeClass = '';
        let badgeText = '';
        if(category === 'exam') { badgeClass = 'badge-exam'; badgeText = 'Exam'; }
        else if(category === 'holiday') { badgeClass = 'badge-holiday'; badgeText = 'Holiday'; }
        else { badgeClass = 'badge-general'; badgeText = 'General'; }

        // Get today's date formatted
        let today = new Date();
        let dateStr = today.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        // Construct HTML for the new card
        let newCardHtml = `
            <div class="notice-card" data-category="${category}">
                <div class="notice-header">
                    <span class="notice-badge ${badgeClass}">${badgeText}</span>
                    <span class="notice-date">Just Now</span>
                </div>
                <h3 class="notice-title">${title}</h3>
                <p class="notice-body">${message}</p>
            </div>
        `;

        // Inject the new card at the top of the feed
        let feed = document.getElementById('feed_container');
        feed.insertAdjacentHTML('afterbegin', newCardHtml);

        // Reset form and close
        document.getElementById('new_title').value = '';
        document.getElementById('new_message').value = '';
        closeCreateNotice();

        // Simulate sending push notifications
        setTimeout(() => {
            alert("📢 BZZZ!\n\nSystem: Push Notification sent to 1,200 student devices!\n'Jalaram Academy: " + title + "'");
        }, 600);
    }

        document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
        clickedElement.classList.add('active');
        renderStore(category);
    }

    function renderStore(filterType) {
        let container = document.getElementById('store_container');
        let html = '';

        products.forEach(p => {
            if (filterType === 'all' || p.type === filterType) {
                
                let discountPercent = Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100);
                let badgeHtml = p.bestseller ? `<div class="tag-bestseller">🏆 Bestseller</div>` : '';
                
                // Button logic (Buy vs View)
                let buttonHtml = '';
                if (p.purchased) {
                    buttonHtml = `<button class="btn-buy btn-purchased" onclick="alert('Opening ${p.type} player/viewer...')">✅ Purchased (View)</button>`;

                    buttonHtml = `<button class="btn-buy" onclick="openCheckout('${p.id}')">Buy Now</button>`;

                                ${buttonHtml}
                            </div>
                        </div>
                    </div>
                `;
            }
        });

        container.innerHTML = html;

        document.getElementById('chk_mrp').innerText = "₹" + currentCheckoutItem.oldPrice;
        
        let discountAmt = currentCheckoutItem.oldPrice - currentCheckoutItem.price;
        document.getElementById('chk_discount').innerText = "-₹" + discountAmt;
        
        document.getElementById('chk_total').innerText = "₹" + currentCheckoutItem.price;
        document.getElementById('chk_btn_amt').innerText = "₹" + currentCheckoutItem.price;

        // Slide up animation

            renderStore(document.querySelector('.filter-pill.active').innerText.toLowerCase().includes('all') ? 'all' : currentCheckoutItem.type);
            
        }, 1500);
    }

    // --- BATCH CHIP TOGGLE LOGIC ---
    function toggleBatch(element) {
        let checkbox = element.querySelector('input');
        checkbox.checked = !checkbox.checked;
        if (checkbox.checked) {
            element.classList.add('selected');
        } else {
            element.classList.remove('selected');
        }
    }

    // --- PUBLISH SLOT LOGIC ---
    function publishQuantumSlot() {
        let title = document.getElementById('slot_title').value.trim();
        let subject = document.getElementById('slot_subject').value;
        let timeVal = document.getElementById('slot_time').value;

        // Gather checked teachers
        let selectedTeachers = [];
        document.querySelectorAll('input[name="teachers"]:checked').forEach(cb => {
            selectedTeachers.push(cb.value);
        });

        // Gather checked batches
        let selectedBatches = [];
        document.querySelectorAll('input[name="batches"]:checked').forEach(cb => {
            selectedBatches.push(cb.value);
        });

        // Validation
        if (title === '') {
            alert("Error: Please enter a lecture title.");
            return;
        }
        if (selectedTeachers.length === 0) {
            alert("Error: Please select at least one teacher for this session.");
            return;
        }
        if (timeVal === '') {
            alert("Error: Please select a date and time slot.");
            return;
        }

        // Format teachers string for display
        let teacherNames = selectedTeachers.join(', ');
        let batchNames = selectedBatches.join(', ');

        // Show Preview Box
        let previewBox = document.getElementById('preview_box');
        let previewContent = document.getElementById('preview_content');
        
        previewContent.innerHTML = `
            <strong>Title:</strong> ${title}<br>
            <strong>Subject:</strong> ${subject.toUpperCase()}<br>
            <strong>Assigned Teachers (${selectedTeachers.length}):</strong> ${teacherNames}<br>
            <strong>Visible Batches:</strong> ${batchNames}<br>
            <strong>Scheduled Time:</strong> ${timeVal}
        `;
        
        previewBox.style.display = 'block';
        previewBox.scrollIntoView({ behavior: 'smooth' });

        alert("🎯 QUANTUM SCHEDULER SYNCED:\n\nSlot successfully pushed! Only students enrolled in [" + batchNames + "] and the assigned teachers will see this in their scheduler.");
    }

                logBox.innerHTML = `✅ <strong>Processed:</strong> Normal input accepted without issues.`;
            }
        } else {
            // Strict sanitization simulation
            let sanitized = input
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, "")
                .replace(/onerror=.*?>/gi, " [Malicious Attribute Stripped]>")

        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
