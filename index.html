                      </span>
                      <button
                        onClick={() => toggleBookmark(q.id)}
                        className="text-rose-400 font-semibold"
                      >
                        Remove
                      </button>
                    </div>
                    <p className="text-xs text-gray-200">{q.text}</p>
                    {customNotes[q.id] && (
                      <p className="text-[11px] text-amber-300 bg-amber-500/10 px-2.5 py-1 rounded">
                        Note: {customNotes[q.id]}
                      </p>
                    )}
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // TAB 5: MY PROFILE
        return (
          <div className="p-4 pb-24 space-y-5">
            <div className="flex items-center justify-between">
              <h2 className="text-base font-extrabold text-white">My Profile</h2>
              <button
                onClick={() => setRightSettingsOpen(true)}
                className="p-2 rounded-full bg-[#1b1e28] border border-gray-800 text-gray-300 text-xs"
              >
                ⚙️
              </button>
            </div>

            {/* User Info Card */}
            <div className="bg-gradient-to-r from-indigo-950/60 to-[#1b1e28] border border-indigo-500/30 rounded-2xl p-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-14 h-14 rounded-2xl bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-2xl">
                  👾
                </div>
                <div>
                  <h3 className="text-sm font-extrabold text-white">{user.name}</h3>
                  <p className="text-xs text-gray-300">{user.classYear}</p>
                  <p className="text-xs text-gray-300">Target Year : {user.targetYear}</p>
                  <p className="text-[11px] text-gray-400 mt-0.5">{user.email}</p>
                </div>
              </div>
              <button
                onClick={() => setEditProfileModalOpen(true)}
                className="text-xs font-bold text-sky-400"
              >
                Edit &gt;
              </button>
            </div>

            {/* My Exams Countdown */}
            <div className="space-y-2.5">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-bold text-white">My Exams</h3>
                <button
                  onClick={() => setSubScreen('my_exams')}
                  className="text-xs font-bold text-sky-400"
                >
                  Manage &gt;
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2.5">
                <div
                  onClick={() => setSubScreen('my_exams')}
                  className="cursor-pointer bg-gradient-to-br from-emerald-950/50 to-[#1b1e28] border border-emerald-700/40 rounded-2xl p-3.5"
                >
                  <p className="text-xs font-bold text-white">🎯 JEE Main 2028</p>
                  <p className="text-[10px] text-gray-400">Jan 22, 2028</p>
                  <p className="text-3xl font-extrabold text-emerald-400 mt-2">464</p>
                  <p className="text-[10px] text-gray-400">Days Left</p>
                </div>
                <div
                  onClick={() => setSubScreen('my_exams')}
                  className="cursor-pointer bg-gradient-to-br from-emerald-950/50 to-[#1b1e28] border border-emerald-700/40 rounded-2xl p-3.5"
                >
                  <p className="text-xs font-bold text-white">🏛️ JEE Advanced 2028</p>
                  <p className="text-[10px] text-gray-400">May 18, 2028</p>
                  <p className="text-3xl font-extrabold text-emerald-400 mt-2">581</p>
                  <p className="text-[10px] text-gray-400">Days Left</p>
                </div>
              </div>
            </div>

            {/* Uploaded Solutions & Purchases */}
            <div className="space-y-2">
              <button
                onClick={() => setSubScreen('my_solutions')}
                className="w-full bg-[#1b1e28] border border-gray-800 rounded-xl p-3.5 flex items-center justify-between text-xs font-bold"
              >
                <span>📤 My Uploaded Solutions</span>
                <span className="text-gray-400">&gt;</span>
              </button>
              <button
                onClick={() => setSubScreen('my_purchases')}
                className="w-full bg-[#1b1e28] border border-gray-800 rounded-xl p-3.5 flex items-center justify-between text-xs font-bold"
              >
                <span>🛍️ My Purchases</span>
                <span className="text-gray-400">&gt;</span>
              </button>
            </div>

            {/* Daily Goal Streak */}
            <div className="bg-[#1b1e28] border border-gray-800 rounded-2xl p-4 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-white">Daily Goal Streak</span>
                <span className="text-xs font-bold text-orange-400">
                  {user.streakDays} day streak 🔥
                </span>
              </div>
              <div className="grid grid-cols-7 text-center text-[10px] text-gray-400">
                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d, idx) => (
                  <div
                    key={d}
                    className={`py-1.5 rounded-lg ${
                      idx === 2 ? 'bg-gray-800 text-white font-bold' : ''
                    }`}
                  >
                    <p>{d}</p>
                    <p className="mt-1">{idx === 2 ? `${user.dailySolved} Qs` : '--'}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* History of Qs Solved */}
            <div className="bg-[#1b1e28] border border-gray-800 rounded-2xl p-4 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-bold text-white">History of Qs Solved</h3>
                <span className="text-[11px] text-sky-400 font-semibold">All Subjects ⌄</span>
              </div>
              <div className="flex gap-2 text-[11px]">
                {['This Week', 'This Month', 'Last 3 Months'].map(rng => (
                  <button
                    key={rng}
                    onClick={() => setHistoryRange(rng)}
                    className={`px-3 py-1 rounded-full border font-semibold ${
                      historyRange === rng
                        ? 'border-sky-500 bg-sky-500/20 text-sky-300'
                        : 'border-gray-800 bg-[#14161f] text-gray-400'
                    }`}
                  >
                    {rng}
                  </button>
                ))}
              </div>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-[#14161f] border border-gray-800 rounded-xl p-3">
                  <p className="text-base font-extrabold text-sky-400">
                    {lastAttempt ? lastAttempt.attemptedCount : 0}
                  </p>
                  <p className="text-[10px] text-gray-400 mt-0.5">Qs Solved</p>
                </div>
                <div className="bg-[#14161f] border border-gray-800 rounded-xl p-3">
                  <p className="text-base font-extrabold text-emerald-400">
                    {lastAttempt && lastAttempt.attemptedCount > 0
                      ? `${Math.round(lastAttempt.timeTakenSeconds / lastAttempt.attemptedCount)}s`
                      : '0.0 s'}
                  </p>
                  <p className="text-[10px] text-gray-400 mt-0.5">Time Per Qs</p>
                </div>
                <div className="bg-[#14161f] border border-gray-800 rounded-xl p-3">
                  <p className="text-base font-extrabold text-rose-400">
                    {lastAttempt && lastAttempt.attemptedCount > 0
                      ? `${Math.round((lastAttempt.correctCount / lastAttempt.attemptedCount) * 100)}%`
                      : '0.0%'}
                  </p>
                  <p className="text-[10px] text-gray-400 mt-0.5">Accuracy</p>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#090a0f] flex flex-col items-center justify-center p-0 sm:p-4 select-none">
          {/* Desktop Simulator Quick Bar */}
          <div className="hidden sm:flex items-center gap-2 mb-3 bg-[#161821] border border-gray-800 px-3.5 py-1.5 rounded-full text-xs text-gray-300">
            <span className="text-amber-400 font-extrabold">Jalaram Academy:</span>
            <button onClick={triggerFourSecondSplash} className="px-2.5 py-0.5 rounded-full hover:bg-gray-800">
              Replay 4s Splash
            </button>
            <button
              onClick={() => startMockTest(MOCK_TESTS_LIST[0])}
              className="px-2.5 py-0.5 rounded-full bg-indigo-600 text-white font-bold"
            >
              Launch Live CBT Test
            </button>
            <button
              onClick={() => setFirebaseModalOpen(true)}
              className="px-2.5 py-0.5 rounded-full bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 font-bold"
            >
              Firebase & AdSense Keys
            </button>
          </div>

          {/* MOBILE PHONE VIEWPORT FRAME */}
          <div className="w-full max-w-[412px] h-screen sm:h-[840px] bg-[#121318] sm:rounded-[36px] sm:border-[6px] sm:border-[#222530] shadow-2xl overflow-hidden flex flex-col relative text-white">
            <div className="flex-1 overflow-y-auto no-scrollbar">
              {subScreen ? renderSubScreen() : renderMainTab()}
            </div>

            {/* Bottom Navigation Bar */}
            {subScreen !== 'live_test' && subScreen !== 'ad_interstitial' && (
              <nav className="bg-[#181a22]/95 border-t border-gray-800 px-2 py-2.5 grid grid-cols-5 z-20 text-center">
                {[
                  { id: 'home', label: 'Home', icon: '🏠' },
                  { id: 'tests', label: 'Tests', icon: '📝' },
                  { id: 'premium', label: 'Pro', icon: '👑' },
                  { id: 'notebooks', label: 'Notebooks', icon: '📓' },
                  { id: 'profile', label: 'My Profile', icon: '👤' }
                ].map(item => {
                  const isActive = activeTab === item.id && subScreen === null;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        setSubScreen(null);
                        setActiveTab(item.id);
                      }}
                      className={`flex flex-col items-center justify-center gap-0.5 ${
                        isActive ? 'text-sky-400 font-extrabold' : 'text-gray-400'
                      }`}
                    >
                      <span className="text-base">{item.icon}</span>
                      <span className="text-[10px]">{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            )}

            {/* LEFT NAVIGATION DRAWER */}
            {leftDrawerOpen && (
              <div className="absolute inset-0 z-50 bg-black/70 flex">
                <div className="w-4/5 max-w-[300px] bg-[#161820] h-full p-5 flex flex-col justify-between border-r border-gray-800">
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-11 h-11 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-base">
                          {user.name[0]}
                        </div>
                        <div>
                          <h3 className="text-sm font-bold text-white">{user.name}</h3>
                          <button
                            onClick={() => {
                              setLeftDrawerOpen(false);
                              setActiveTab('profile');
                            }}
                            className="text-xs text-sky-400"
                          >
                            View Profile &gt;
                          </button>
                        </div>
                      </div>
                      <button
                        onClick={() => setLeftDrawerOpen(false)}
                        className="p-1 text-gray-400 text-xs"
                      >
                        ✕
                      </button>
                    </div>

                    <div className="space-y-4 text-xs">
                      <button
                        onClick={() => setStreamModalOpen(true)}
                        className="w-full flex items-center justify-between py-2 text-gray-200 font-semibold"
                      >
                        <span>🔀 Stream</span>
                        <span className="px-2 py-0.5 rounded bg-gray-800 text-[10px] uppercase text-sky-400 font-bold">
                          {user.stream} &gt;
                        </span>
                      </button>

                      <button
                        onClick={() => {
                          setLeftDrawerOpen(false);
                          setSubScreen('notifications');
                        }}
                        className="w-full flex items-center justify-between py-2 text-gray-200 font-semibold"
                      >
                        <span>🔔 Notifications</span>
                        <span className="text-gray-500">&gt;</span>
                      </button>

                      <button
                        onClick={() => {
                          setLeftDrawerOpen(false);
                          setRightSettingsOpen(true);
                        }}
                        className="w-full flex items-center justify-between py-2 text-gray-200 font-semibold"
                      >
                        <span>⚙️ Settings</span>
                        <span className="text-gray-500">&gt;</span>
                      </button>

                      <div className="space-y-2 pt-2 border-t border-gray-800">
                        <span className="text-gray-400 font-semibold">🌗 Theme</span>
                        <div className="grid grid-cols-3 gap-2 pt-1">
                          {['System', 'Light', 'Dark'].map(t => (
                            <button
                              key={t}
                              onClick={() => setThemeMode(t)}
                              className={`py-1.5 rounded-lg border text-[11px] font-bold ${
                                themeMode === t
                                  ? 'border-sky-500 bg-sky-500/20 text-sky-300'
                                  : 'border-gray-800 bg-gray-900 text-gray-400'
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="text-center space-y-1 pt-4 border-t border-gray-800">
                    <p className="text-xs font-extrabold text-amber-400">📘 JALARAM ACADEMY</p>
                    <p className="text-[10px] text-gray-500">Mentored 200+ IITians • V 2.1</p>
                  </div>
                </div>
                <div className="flex-1" onClick={() => setLeftDrawerOpen(false)} />
              </div>
            )}

            {/* STREAM SELECTION MODAL */}
            {streamModalOpen && (
              <div className="absolute inset-0 z-50 bg-black/75 flex flex-col justify-end">
                <div className="bg-[#1b1e28] rounded-t-3xl p-5 space-y-4 border-t border-gray-700">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-bold">Select Stream</h3>
                    <button onClick={() => setStreamModalOpen(false)} className="text-xs text-gray-400">
                      ✕
                    </button>
                  </div>
                  {['Engineering', 'Medical'].map(st => (
                    <button
                      key={st}
                      onClick={() => {
                        setUser({ ...user, stream: st });
                        setStreamModalOpen(false);
                      }}
                      className={`w-full p-3.5 rounded-xl border text-left text-xs font-bold flex items-center gap-3 ${
                        user.stream === st
                          ? 'border-sky-500 bg-sky-500/10 text-white'
                          : 'border-gray-800 text-gray-400'
                      }`}
                    >
                      <span className="w-4 h-4 rounded-full border border-sky-400 flex items-center justify-center">
                        {user.stream === st && <span className="w-2 h-2 rounded-full bg-sky-400" />}
                      </span>
                      {st}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* RIGHT SETTINGS DRAWER */}
            {rightSettingsOpen && (
              <div className="absolute inset-0 z-50 bg-black/70 flex justify-end">
                <div className="flex-1" onClick={() => setRightSettingsOpen(false)} />
                <div className="w-4/5 max-w-[290px] bg-[#161820] h-full p-5 space-y-6 border-l border-gray-800">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-bold">Settings</h3>
                    <button
                      onClick={() => setRightSettingsOpen(false)}
                      className="px-2 py-1 rounded-lg bg-gray-800 text-gray-300 text-xs"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="text-gray-200 font-semibold">Push Notifications</span>
                      <button
                        onClick={() => setPushNotif(!pushNotif)}
                        className={`w-10 h-5 rounded-full p-0.5 transition ${
                          pushNotif ? 'bg-sky-500' : 'bg-gray-700'
                        }`}
                      >
                        <div
                          className={`w-4 h-4 rounded-full bg-white transition transform ${
                            pushNotif ? 'translate-x-5' : 'translate-x-0'
                          }`}
                        />
                      </button>
                    </div>

                    <div className="flex items-center justify-between">
                      <span className="text-gray-200 font-semibold">Email Notifications</span>
                      <button
                        onClick={() => setEmailNotif(!emailNotif)}
                        className={`w-10 h-5 rounded-full p-0.5 transition ${
                          emailNotif ? 'bg-sky-500' : 'bg-gray-700'
                        }`}
                      >
                        <div
                          className={`w-4 h-4 rounded-full bg-white transition transform ${
                            emailNotif ? 'translate-x-5' : 'translate-x-0'
                          }`}
                        />
                      </button>
                    </div>

                    <button
                      onClick={() => {
                        setRightSettingsOpen(false);
                        setEditProfileModalOpen(true);
                      }}
                      className="w-full flex items-center justify-between py-2 text-gray-200 font-semibold border-t border-gray-800 pt-3"
                    >
                      <span>Edit Profile</span>
                      <span>✏️</span>
                    </button>

                    <button
                      onClick={() => {
                        setRightSettingsOpen(false);
                        setFirebaseModalOpen(true);
                      }}
                      className="w-full flex items-center justify-between py-2 text-sky-400 font-semibold"
                    >
                      <span>Firebase & Google Ads Setup</span>
                      <span>☁️</span>
                    </button>

                    <button
                      onClick={() => setRightSettingsOpen(false)}
                      className="text-rose-400 font-bold pt-2 block"
                    >
                      Log out
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* EDIT PROFILE MODAL */}
            {editProfileModalOpen && (
              <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="bg-[#181b24] border border-gray-700 rounded-2xl p-4 w-full space-y-3">
                  <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                    <h3 className="text-sm font-extrabold">Edit Student Profile</h3>
                    <button onClick={() => setEditProfileModalOpen(false)} className="text-xs">
                      ✕
                    </button>
                  </div>
                  <div className="space-y-2 text-xs">
                    <label className="block text-gray-400">Student Name</label>
                    <input
                      value={user.name}
                      onChange={e => setUser({ ...user, name: e.target.value })}
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white"
                    />
                    <label className="block text-gray-400">Class</label>
                    <input
                      value={user.classYear}
                      onChange={e => setUser({ ...user, classYear: e.target.value })}
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white"
                    />
                  </div>
                  <button
                    onClick={() => setEditProfileModalOpen(false)}
                    className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs"
                  >
                    Save Changes
                  </button>
                </div>
              </div>
            )}

            {/* FIREBASE & GOOGLE ADSENSE SETUP MODAL */}
            {firebaseModalOpen && (
              <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="bg-[#181b24] border border-gray-700 rounded-2xl p-4 w-full max-h-[85%] overflow-y-auto space-y-3">
                  <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                    <h3 className="text-sm font-extrabold text-white">
                      ☁️ Connect Firebase & Google Ads
                    </h3>
                    <button
                      onClick={() => setFirebaseModalOpen(false)}
                      className="px-2 py-0.5 rounded bg-gray-800 text-xs"
                    >
                      ✕
                    </button>
                  </div>

                  <p className="text-[11px] text-gray-400 leading-relaxed">
                    Enter your Firebase Project credentials and Google AdSense Publisher ID. Your test attempts and student accounts will sync to your Firebase project automatically.
                  </p>

                  <div className="space-y-2 text-xs">
                    <label className="block text-indigo-300 font-bold">Firebase API Key</label>
                    <input
                      value={fbConfig.apiKey}
                      onChange={e => setFbConfig({ ...fbConfig, apiKey: e.target.value })}
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white font-mono text-xs"
                    />
                    <label className="block text-indigo-300 font-bold">Firebase Auth Domain</label>
                    <input
                      value={fbConfig.authDomain}
                      onChange={e => setFbConfig({ ...fbConfig, authDomain: e.target.value })}
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white font-mono text-xs"
                    />
                    <label className="block text-indigo-300 font-bold">Firebase Project ID</label>
                    <input
                      value={fbConfig.projectId}
                      onChange={e => setFbConfig({ ...fbConfig, projectId: e.target.value })}
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white font-mono text-xs"
                    />
                    <label className="block text-amber-300 font-bold pt-1">
                      Google AdSense Publisher ID
                    </label>
                    <input
                      value={adConfig.publisherId}
                      onChange={e => setAdConfig({ ...adConfig, publisherId: e.target.value })}
                      placeholder="ca-pub-XXXXXXXXXXXXXXXX"
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white font-mono text-xs"
                    />
                    <label className="block text-amber-300 font-bold">
                      AdSense Interstitial Slot ID
                    </label>
                    <input
                      value={adConfig.interstitialSlotId}
                      onChange={e => setAdConfig({ ...adConfig, interstitialSlotId: e.target.value })}
                      placeholder="1234567890"
                      className="w-full bg-[#101218] border border-gray-700 rounded-lg px-2.5 py-1.5 text-white font-mono text-xs"
                    />
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      onClick={handleGoogleSignIn}
                      className="flex-1 py-2.5 rounded-xl bg-white text-black font-extrabold text-xs"
                    >
                      Test Google Sign-In
                    </button>
                    <button
                      onClick={() => {
                        localStorage.setItem('jalaram_fb_config', JSON.stringify(fbConfig));
                        localStorage.setItem('jalaram_ad_config', JSON.stringify(adConfig));
                        setFirebaseModalOpen(false);
                      }}
                      className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-black font-extrabold text-xs"
                    >
                      Save & Activate
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JalaramAcademyApp />);
  </script>
</body>
</html>
